name: ai-feature-review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-feature-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-feature-review:
    name: ai-feature-review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AI feature review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python review_cli.py --feature landing_page --mode ci --out review-output.json

      - name: Post findings as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- ai-feature-review-marker -->';
            const reportPath = 'review-output.json';
            const icon = { critical: '🔴', high: '🟠', medium: '🟡', low: '⚪' };

            let body;
            if (!fs.existsSync(reportPath)) {
              body = [
                '### 🤖 AI Feature Review',
                '',
                '⚠️ The reviewer did not produce `review-output.json` — the job likely ' +
                  'crashed before it could run. Check the workflow logs.',
              ].join('\n');
            } else {
              const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              const findings = report.findings || [];
              const blocking = report.blocking || [];
              const blockingKeys = new Set(blocking.map(f => JSON.stringify(f)));

              const lines = ['### 🤖 AI Feature Review', ''];

              if (!report.ok) {
                lines.push(`⚠️ **The reviewer itself failed:** ${report.error || 'unknown error'}`, '');
              } else if (blocking.length) {
                lines.push('❌ **Blocking findings — merge gate failed.**', '');
              } else if (findings.length) {
                lines.push('✅ Findings reported, none blocking.', '');
              } else {
                lines.push('✅ No findings.', '');
              }

              if (findings.length) {
                lines.push('| Severity | Category | Location | Summary | Blocks merge |');
                lines.push('|---|---|---|---|---|');
                for (const f of findings) {
                  const blocks = blockingKeys.has(JSON.stringify(f)) ? '🚫' : '';
                  const sev = String(f.severity || '?').toUpperCase();
                  lines.push(
                    `| ${icon[f.severity] || ''} ${sev} | ${f.category || ''} | ` +
                    `\`${f.file}:${f.line}\` | ${f.summary || ''} | ${blocks} |`
                  );
                }
                lines.push('');
              }

              if (report.denied_calls && report.denied_calls.length) {
                lines.push('<details><summary>Denied tool calls</summary>', '');
                for (const d of report.denied_calls) {
                  lines.push(`- \`${d.tool}(${d.input})\` — ${d.reason}`);
                }
                lines.push('', '</details>', '');
              }

              lines.push(
                '---',
                `exit code \`${report.exit_code}\` · ${report.turns} turns · ` +
                `$${(report.cost_usd || 0).toFixed(4)} · session \`${report.session_id}\``
              );

              body = lines.join('\n');
            }

            body += `\n\n${marker}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-output
          path: review-output.json
          if-no-files-found: ignore
